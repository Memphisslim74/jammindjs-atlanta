name: Expand site source

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/source.zip.part-*"

permissions:
  contents: write

concurrency:
  group: bootstrap-site-source
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand committed site source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.zip.part-* > /tmp/jammindjs-atlanta-source.zip
          unzip -oq /tmp/jammindjs-atlanta-source.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish JAMMIN' DJs Atlanta site"
          git push origin main
